name: GC-42 OIDC Claims Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-oidc-claims:
    name: Inspect sanitized GitHub OIDC claims
    runs-on: ubuntu-latest
    environment: aws-nonprod-parser
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Request and print allowlisted OIDC claims
        shell: bash
        env:
          EXPECTED_REPOSITORY: SmartBusinessv1/smart-business
          EXPECTED_REPOSITORY_ID: "1287523579"
          EXPECTED_REPOSITORY_OWNER_ID: "298686418"
          EXPECTED_ENVIRONMENT: aws-nonprod-parser
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${response}")"

          TOKEN="${token}" python3 <<'PY'
          import base64
          import json
          import os
          import sys

          token = os.environ["TOKEN"]
          parts = token.split(".")
          if len(parts) != 3:
              raise SystemExit("OIDC_TOKEN_FORMAT_INVALID")

          payload_part = parts[1] + "=" * (-len(parts[1]) % 4)
          payload = json.loads(base64.urlsafe_b64decode(payload_part.encode()).decode())

          allowlisted_keys = (
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "environment",
              "ref",
              "workflow",
              "job_workflow_ref",
              "actor",
              "actor_id",
              "event_name",
          )
          allowlisted = {key: payload.get(key) for key in allowlisted_keys if key in payload}
          print("SANITIZED_OIDC_CLAIMS=" + json.dumps(allowlisted, sort_keys=True))

          expected = {
              "aud": "sts.amazonaws.com",
              "repository": os.environ["EXPECTED_REPOSITORY"],
              "repository_id": os.environ["EXPECTED_REPOSITORY_ID"],
              "repository_owner_id": os.environ["EXPECTED_REPOSITORY_OWNER_ID"],
              "environment": os.environ["EXPECTED_ENVIRONMENT"],
              "ref": os.environ["EXPECTED_REF"],
          }

          mismatches = []
          for key, expected_value in expected.items():
              actual = payload.get(key)
              if str(actual) != expected_value:
                  mismatches.append(f"{key}: expected {expected_value!r}, got {actual!r}")

          if mismatches:
              print("OIDC_CLAIM_CONTRACT_MISMATCH")
              for mismatch in mismatches:
                  print("- " + mismatch)
              sys.exit(1)

          print("OIDC_CLAIM_CONTRACT_BASELINE_PASS")
          PY
