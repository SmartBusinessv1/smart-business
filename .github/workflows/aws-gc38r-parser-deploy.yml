name: SB-P-1.11-GC-38R Parser Non-Production Deploy

# Deploys the locked Lambda Parser EIS's AWS infrastructure to the already
# provisioned, narrowly-scoped non-production execution boundary
# (instruction1.144.md). Manually triggered only; every mutating step runs
# strictly within the approved GitHub OIDC -> TeamLIPS-SB-NonProd-Parser-
# DeployRole path, gated by the `aws-nonprod-parser` protected environment
# and the `refs/heads/main`-only trust condition already enforced by the
# deploy role's trust policy (communication/evidence/SB-P-1.11-GC-43A/
# aws-deploy-role-trust.json). No static AWS credential is used anywhere in
# this workflow. No production account, region, or resource is touched.
#
# Idempotent by design: every AWS resource is created only if it does not
# already exist (check-then-create), so re-running this workflow (e.g. to
# push updated Lambda code) never re-provisions IAM/Roles-Anywhere/S3
# state that already exists, and never rotates the workload certificate
# unless `reissue_workload_certificate` is explicitly set to true (see
# report1.108.md §7.1's certificate rotation/reissuance requirement).

on:
  workflow_dispatch:
    inputs:
      reissue_workload_certificate:
        description: >-
          Reissue the workload end-entity certificate under the existing
          Trust Anchor's CA (requires the PARSER_TRUST_ANCHOR_CA_PRIVATE_KEY
          environment secret to already be set from a prior creation run).
          Leave false for an ordinary Lambda code deploy.
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_DEFAULT_REGION: ap-south-1
  EXPECTED_ACCOUNT_ID: "658980433673"
  DEPLOY_ROLE_ARN: arn:aws:iam::658980433673:role/TeamLIPS-SB-NonProd-Parser-DeployRole
  RUNTIME_BOUNDARY_ARN: arn:aws:iam::658980433673:policy/TeamLIPS-SB-NonProd-Parser-RuntimeBoundary
  LAMBDA_EXECUTION_ROLE_NAME: TeamLIPS-SB-NonProd-Parser-LambdaExecutionRole
  WORKLOAD_ROLE_NAME: TeamLIPS-SB-NonProd-Parser-WorkloadRole
  LAMBDA_FUNCTION_NAME: teamlips-sb-np-parser
  BUCKET_NAME: teamlips-sb-np-parser-658980433673-ap-south-1
  TRUST_ANCHOR_NAME: teamlips-sb-np-parser-trust-anchor
  ROLES_ANYWHERE_PROFILE_NAME: teamlips-sb-np-parser-profile

jobs:
  deploy:
    name: Deploy non-production parser infrastructure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-nonprod-parser
    permissions:
      contents: read
      id-token: write
    outputs:
      lambda_function_arn: ${{ steps.summary.outputs.lambda_function_arn }}
      function_url: ${{ steps.summary.outputs.function_url }}
      trust_anchor_arn: ${{ steps.summary.outputs.trust_anchor_arn }}
      profile_arn: ${{ steps.summary.outputs.profile_arn }}
      workload_role_arn: ${{ steps.summary.outputs.workload_role_arn }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build Lambda bundle
        run: npm run build:lambda

      - name: Package Lambda deployment artifact
        run: |
          set -euo pipefail
          cd lambda/parser/dist
          zip -q -X ../handler.zip handler.js
          cd ../../..
          ls -la lambda/parser/handler.zip

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${AWS_REGION}" = "ap-south-1"
          echo "GC38R_PREFLIGHT_PASS account=${EXPECTED_ACCOUNT_ID} region=${AWS_REGION} ref=${GITHUB_REF}"

      - name: Assume TeamLIPS-SB-NonProd-Parser-DeployRole via GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          web_identity_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${token_response}")"

          session_name="gc38r-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          aws sts assume-role-with-web-identity \
            --role-arn "${DEPLOY_ROLE_ARN}" \
            --role-session-name "${session_name}" \
            --web-identity-token "${web_identity_token}" \
            --duration-seconds 3600 \
            --output json > "${response_file}"

          readarray -t creds < <(python3 - "${response_file}" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          c = data["Credentials"]
          print(c["AccessKeyId"])
          print(c["SecretAccessKey"])
          print(c["SessionToken"])
          PY
          )
          echo "::add-mask::${creds[0]}"
          echo "::add-mask::${creds[1]}"
          echo "::add-mask::${creds[2]}"
          {
            echo "AWS_ACCESS_KEY_ID=${creds[0]}"
            echo "AWS_SECRET_ACCESS_KEY=${creds[1]}"
            echo "AWS_SESSION_TOKEN=${creds[2]}"
          } >> "${GITHUB_ENV}"

      - name: Verify caller identity
        shell: bash
        run: |
          set -euo pipefail
          caller="$(aws sts get-caller-identity --output json)"
          account="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["Account"])' <<<"${caller}")"
          arn="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["Arn"])' <<<"${caller}")"
          test "${account}" = "${EXPECTED_ACCOUNT_ID}"
          case "${arn}" in
            arn:aws:sts::658980433673:assumed-role/TeamLIPS-SB-NonProd-Parser-DeployRole/*) ;;
            *) echo "UNEXPECTED_CALLER_ARN"; exit 1 ;;
          esac
          echo "GC38R_CALLER_IDENTITY_PASS account=${account}"

      # -----------------------------------------------------------------
      # S3 -- private transient parser-ingress bucket (Lambda Parser EIS
      # §10). Block Public Access all four settings, TLS-only bucket
      # policy, default encryption, versioning disabled, 1-day Lifecycle
      # expiration backstop.
      # -----------------------------------------------------------------
      - name: Create/configure S3 ingress bucket
        shell: bash
        run: |
          set -euo pipefail
          if aws s3api head-bucket --bucket "${BUCKET_NAME}" 2>/dev/null; then
            echo "GC38R_S3_BUCKET_EXISTS"
          else
            aws s3api create-bucket \
              --bucket "${BUCKET_NAME}" \
              --region "${AWS_REGION}" \
              --create-bucket-configuration LocationConstraint="${AWS_REGION}"
            echo "GC38R_S3_BUCKET_CREATED"
          fi

          aws s3api put-public-access-block \
            --bucket "${BUCKET_NAME}" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          aws s3api put-bucket-encryption \
            --bucket "${BUCKET_NAME}" \
            --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          cat > /tmp/bucket-policy.json <<POLICY
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "DenyInsecureTransport",
                "Effect": "Deny",
                "Principal": "*",
                "Action": "s3:*",
                "Resource": [
                  "arn:aws:s3:::${BUCKET_NAME}",
                  "arn:aws:s3:::${BUCKET_NAME}/*"
                ],
                "Condition": { "Bool": { "aws:SecureTransport": "false" } }
              }
            ]
          }
          POLICY
          aws s3api put-bucket-policy --bucket "${BUCKET_NAME}" --policy file:///tmp/bucket-policy.json

          cat > /tmp/lifecycle.json <<'LIFECYCLE'
          {
            "Rules": [
              {
                "ID": "parser-ingress-1-day-backstop",
                "Filter": { "Prefix": "parser-ingress/" },
                "Status": "Enabled",
                "Expiration": { "Days": 1 }
              }
            ]
          }
          LIFECYCLE
          aws s3api put-bucket-lifecycle-configuration \
            --bucket "${BUCKET_NAME}" \
            --lifecycle-configuration file:///tmp/lifecycle.json

          echo "GC38R_S3_BUCKET_CONFIGURED"

      # -----------------------------------------------------------------
      # IAM -- the two boundary-protected runtime roles. Both created
      # only with the exact RuntimeBoundary permissions boundary attached
      # (required by the deploy policy's own CreateRole condition).
      # -----------------------------------------------------------------
      - name: Create/configure Lambda execution role
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/lambda-trust.json <<'TRUST'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Service": "lambda.amazonaws.com" },
                "Action": "sts:AssumeRole"
              }
            ]
          }
          TRUST

          if aws iam get-role --role-name "${LAMBDA_EXECUTION_ROLE_NAME}" >/dev/null 2>&1; then
            echo "GC38R_LAMBDA_EXEC_ROLE_EXISTS"
          else
            aws iam create-role \
              --role-name "${LAMBDA_EXECUTION_ROLE_NAME}" \
              --assume-role-policy-document file:///tmp/lambda-trust.json \
              --permissions-boundary "${RUNTIME_BOUNDARY_ARN}" \
              --tags Key=Project,Value=SmartBusiness Key=Environment,Value=nonprod \
                     Key=Workstream,Value=SB-P-1.11 Key=Component,Value=lambda-parser \
                     Key=Owner,Value=TeamLIPS Key=ManagedBy,Value=GitHubActions
            echo "GC38R_LAMBDA_EXEC_ROLE_CREATED"
          fi

          cat > /tmp/lambda-exec-policy.json <<POLICY
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "AllowExactParserObjectReadDelete",
                "Effect": "Allow",
                "Action": ["s3:GetObject", "s3:DeleteObject"],
                "Resource": "arn:aws:s3:::${BUCKET_NAME}/*"
              },
              {
                "Sid": "AllowExactParserRuntimeLogging",
                "Effect": "Allow",
                "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
                "Resource": "arn:aws:logs:${AWS_REGION}:${EXPECTED_ACCOUNT_ID}:log-group:/aws/lambda/${LAMBDA_FUNCTION_NAME}:*"
              }
            ]
          }
          POLICY
          aws iam put-role-policy \
            --role-name "${LAMBDA_EXECUTION_ROLE_NAME}" \
            --policy-name teamlips-sb-np-parser-lambda-exec-policy \
            --policy-document file:///tmp/lambda-exec-policy.json
          echo "GC38R_LAMBDA_EXEC_ROLE_CONFIGURED"

      - name: Create/configure workload role
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/workload-trust.json <<'TRUST'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Service": "rolesanywhere.amazonaws.com" },
                "Action": ["sts:AssumeRole", "sts:TagSession", "sts:SetSourceIdentity"],
                "Condition": {
                  "ArnEquals": {
                    "aws:SourceArn": "arn:aws:rolesanywhere:${AWS_REGION}:${EXPECTED_ACCOUNT_ID}:trust-anchor/*"
                  }
                }
              }
            ]
          }
          TRUST

          if aws iam get-role --role-name "${WORKLOAD_ROLE_NAME}" >/dev/null 2>&1; then
            echo "GC38R_WORKLOAD_ROLE_EXISTS"
          else
            aws iam create-role \
              --role-name "${WORKLOAD_ROLE_NAME}" \
              --assume-role-policy-document file:///tmp/workload-trust.json \
              --permissions-boundary "${RUNTIME_BOUNDARY_ARN}" \
              --tags Key=Project,Value=SmartBusiness Key=Environment,Value=nonprod \
                     Key=Workstream,Value=SB-P-1.11 Key=Component,Value=lambda-parser \
                     Key=Owner,Value=TeamLIPS Key=ManagedBy,Value=GitHubActions
            echo "GC38R_WORKLOAD_ROLE_CREATED"
          fi

          cat > /tmp/workload-policy.json <<POLICY
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "AllowExactParserObjectPutOnly",
                "Effect": "Allow",
                "Action": "s3:PutObject",
                "Resource": "arn:aws:s3:::${BUCKET_NAME}/*"
              },
              {
                "Sid": "AllowExactParserFunctionUrlInvocation",
                "Effect": "Allow",
                "Action": "lambda:InvokeFunctionUrl",
                "Resource": [
                  "arn:aws:lambda:${AWS_REGION}:${EXPECTED_ACCOUNT_ID}:function:${LAMBDA_FUNCTION_NAME}",
                  "arn:aws:lambda:${AWS_REGION}:${EXPECTED_ACCOUNT_ID}:function:${LAMBDA_FUNCTION_NAME}:*"
                ],
                "Condition": { "StringEquals": { "lambda:FunctionUrlAuthType": "AWS_IAM" } }
              },
              {
                "Sid": "AllowExactParserFunctionInvocationViaFunctionUrlOnly",
                "Effect": "Allow",
                "Action": "lambda:InvokeFunction",
                "Resource": [
                  "arn:aws:lambda:${AWS_REGION}:${EXPECTED_ACCOUNT_ID}:function:${LAMBDA_FUNCTION_NAME}",
                  "arn:aws:lambda:${AWS_REGION}:${EXPECTED_ACCOUNT_ID}:function:${LAMBDA_FUNCTION_NAME}:*"
                ],
                "Condition": { "Bool": { "lambda:InvokedViaFunctionUrl": "true" } }
              }
            ]
          }
          POLICY
          aws iam put-role-policy \
            --role-name "${WORKLOAD_ROLE_NAME}" \
            --policy-name teamlips-sb-np-parser-workload-policy \
            --policy-document file:///tmp/workload-policy.json
          echo "GC38R_WORKLOAD_ROLE_CONFIGURED"

      # -----------------------------------------------------------------
      # IAM Roles Anywhere -- self-signed non-production CA registered as
      # the Trust Anchor, plus an end-entity certificate/key issued from
      # it. Reconciled against the locked EIS's certificate
      # rotation/reissuance/revocation requirement (report1.108.md §7.1,
      # §17 item 7):
      #
      #  - First-time creation (no Trust Anchor of this exact name yet):
      #    a fresh CA and end-entity certificate are generated. The CA
      #    private key is included in the one-time handoff artifact
      #    alongside the end-entity material, with an explicit
      #    instruction for Mission Control to move it into the
      #    `PARSER_TRUST_ANCHOR_CA_PRIVATE_KEY` GitHub Actions
      #    environment secret (`aws-nonprod-parser`) -- this is what
      #    makes later end-entity reissuance possible without ever
      #    creating a second Trust Anchor. The deploy role has no
      #    Roles Anywhere update/delete authority by design, so this
      #    workflow itself never persists the CA key anywhere; only a
      #    human, using GitHub's own encrypted-secret storage (no new
      #    AWS authority, no file/artifact left behind after this run),
      #    can make it durably available for later runs.
      #  - Reissuance (Trust Anchor already exists, this run was
      #    explicitly dispatched with `reissue_workload_certificate:
      #    true`, and the CA private key secret is available): a new
      #    end-entity keypair is generated and signed by the *same* CA
      #    (read only from the secret, never regenerated, never written
      #    to disk outside this step's own temp directory), so the
      #    existing Trust Anchor/Profile are untouched -- an overlapping
      #    reissuance, not a replacement. If reissuance is requested but
      #    the CA secret is absent, this step fails closed rather than
      #    silently skipping.
      #  - Immediate revocation on suspected compromise is out of this
      #    deploy role's authority by construction (no
      #    rolesanywhere:UpdateTrustAnchor/DeleteTrustAnchor grant, and
      #    none is added here -- that would broaden AWS authority beyond
      #    what GC-41/GC-43 approved). Emergency revocation requires the
      #    same one-time elevated root/IAM-admin path already established
      #    for RuntimeBoundary changes (report1.153.md §9); this workflow
      #    only documents that, it does not perform it.
      # -----------------------------------------------------------------
      - name: Create/reissue IAM Roles Anywhere trust anchor and profile
        id: roles_anywhere
        shell: bash
        env:
          CA_PRIVATE_KEY_SECRET: ${{ secrets.PARSER_TRUST_ANCHOR_CA_PRIVATE_KEY }}
          REISSUE_REQUESTED: ${{ github.event.inputs.reissue_workload_certificate }}
        run: |
          set -euo pipefail

          existing_ta="$(aws rolesanywhere list-trust-anchors --output json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((t['trustAnchorArn'] for t in d.get('trustAnchors',[]) if t.get('name')=='${TRUST_ANCHOR_NAME}'), ''))")"

          cert_generated=false
          mkdir -p /tmp/parser-pki
          cd /tmp/parser-pki

          if [ -z "${existing_ta}" ]; then
            openssl genrsa -out ca.key 2048
            openssl req -x509 -new -key ca.key -sha256 -days 3650 \
              -subj "/O=Team LIPS/OU=Smart Business Non-Production/CN=Smart Business Parser Ingress CA" \
              -out ca.pem

            openssl genrsa -out end-entity.key 2048
            openssl req -new -key end-entity.key \
              -subj "/O=Team LIPS/OU=Smart Business Non-Production/CN=Smart Business Parser Ingress Caller" \
              -out end-entity.csr
            openssl x509 -req -in end-entity.csr -CA ca.pem -CAkey ca.key -CAcreateserial \
              -days 397 -sha256 -out end-entity.pem
            openssl pkcs8 -topk8 -nocrypt -in end-entity.key -out end-entity.pkcs8.pem

            ta_response="$(aws rolesanywhere create-trust-anchor \
              --name "${TRUST_ANCHOR_NAME}" \
              --source "sourceType=CERTIFICATE_BUNDLE,sourceData={x509CertificateData=$(cat ca.pem | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}" \
              --enabled \
              --tags Key=Project,Value=SmartBusiness Key=Environment,Value=nonprod \
                     Key=Workstream,Value=SB-P-1.11 Key=Component,Value=lambda-parser \
                     Key=Owner,Value=TeamLIPS Key=ManagedBy,Value=GitHubActions \
              --output json)"
            trust_anchor_arn="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["trustAnchor"]["trustAnchorArn"])' <<<"${ta_response}")"
            echo "GC38R_TRUST_ANCHOR_CREATED arn=${trust_anchor_arn}"
            cert_generated=true

            # Never printed to the log and never round-tripped through
            # GITHUB_ENV. Written only to a workspace-local directory
            # picked up by the short-retention artifact upload step
            # below -- the only handoff channel available to this
            # workflow, since it has no Cloudflare/Lovable access to
            # deliver secret material directly into the server's own
            # secret store (report1.108.md §20.4 -- that provisioning
            # step, and durably storing the CA key as a GitHub secret for
            # future reissuance, are explicitly human/Mission Control
            # actions).
            mkdir -p "${GITHUB_WORKSPACE}/.parser-pki-handoff"
            cp end-entity.pem "${GITHUB_WORKSPACE}/.parser-pki-handoff/workload-certificate.pem"
            cp end-entity.pkcs8.pem "${GITHUB_WORKSPACE}/.parser-pki-handoff/workload-private-key.pem"
            cp ca.pem "${GITHUB_WORKSPACE}/.parser-pki-handoff/trust-anchor-ca.pem"
            cp ca.key "${GITHUB_WORKSPACE}/.parser-pki-handoff/trust-anchor-ca-private-key.pem"
          elif [ "${REISSUE_REQUESTED}" = "true" ]; then
            if [ -z "${CA_PRIVATE_KEY_SECRET}" ]; then
              echo "GC38R_REISSUE_REQUESTED_BUT_CA_SECRET_MISSING" >&2
              echo "Reissuance was requested but the PARSER_TRUST_ANCHOR_CA_PRIVATE_KEY environment secret is not set. Cannot sign a new end-entity certificate without the existing Trust Anchor's CA private key, and this workflow will not create a second Trust Anchor as a substitute (that would leave two trust anchors live for the same non-production role, widening the acceptance surface, not narrowing it)." >&2
              exit 1
            fi
            printf '%s' "${CA_PRIVATE_KEY_SECRET}" > ca.key
            aws rolesanywhere get-trust-anchor --trust-anchor-id "$(basename "${existing_ta}")" \
              --output json | python3 -c 'import json,sys; print(json.load(sys.stdin)["trustAnchor"]["source"]["sourceData"]["x509CertificateData"])' \
              > ca.pem

            openssl genrsa -out end-entity.key 2048
            openssl req -new -key end-entity.key \
              -subj "/O=Team LIPS/OU=Smart Business Non-Production/CN=Smart Business Parser Ingress Caller" \
              -out end-entity.csr
            openssl x509 -req -in end-entity.csr -CA ca.pem -CAkey ca.key -CAcreateserial \
              -days 397 -sha256 -out end-entity.pem
            openssl pkcs8 -topk8 -nocrypt -in end-entity.key -out end-entity.pkcs8.pem

            trust_anchor_arn="${existing_ta}"
            echo "GC38R_END_ENTITY_CERTIFICATE_REISSUED trust_anchor_arn=${trust_anchor_arn}"
            cert_generated=true

            mkdir -p "${GITHUB_WORKSPACE}/.parser-pki-handoff"
            cp end-entity.pem "${GITHUB_WORKSPACE}/.parser-pki-handoff/workload-certificate.pem"
            cp end-entity.pkcs8.pem "${GITHUB_WORKSPACE}/.parser-pki-handoff/workload-private-key.pem"
            # The CA key/cert are not re-included here: they were already
            # handed off once at creation and are expected to already be
            # durably stored (as the environment secret this branch just
            # read them back from) -- re-emitting them on every
            # reissuance would only multiply the number of places the CA
            # key has ever been written to disk, working against "do not
            # persist insecurely."
          else
            echo "GC38R_TRUST_ANCHOR_EXISTS arn=${existing_ta}"
            trust_anchor_arn="${existing_ta}"
          fi

          echo "trust_anchor_arn=${trust_anchor_arn}" >> "${GITHUB_OUTPUT}"
          echo "cert_generated=${cert_generated}" >> "${GITHUB_OUTPUT}"

          existing_profile="$(aws rolesanywhere list-profiles --output json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((p['profileArn'] for p in d.get('profiles',[]) if p.get('name')=='${ROLES_ANYWHERE_PROFILE_NAME}'), ''))")"

          if [ -n "${existing_profile}" ]; then
            echo "GC38R_PROFILE_EXISTS arn=${existing_profile}"
            profile_arn="${existing_profile}"
          else
            workload_role_arn="arn:aws:iam::${EXPECTED_ACCOUNT_ID}:role/${WORKLOAD_ROLE_NAME}"
            profile_response="$(aws rolesanywhere create-profile \
              --name "${ROLES_ANYWHERE_PROFILE_NAME}" \
              --role-arns "${workload_role_arn}" \
              --enabled \
              --duration-seconds 900 \
              --tags Key=Project,Value=SmartBusiness Key=Environment,Value=nonprod \
                     Key=Workstream,Value=SB-P-1.11 Key=Component,Value=lambda-parser \
                     Key=Owner,Value=TeamLIPS Key=ManagedBy,Value=GitHubActions \
              --output json)"
            profile_arn="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["profile"]["profileArn"])' <<<"${profile_response}")"
            echo "GC38R_PROFILE_CREATED arn=${profile_arn}"
          fi
          echo "profile_arn=${profile_arn}" >> "${GITHUB_OUTPUT}"

      # -----------------------------------------------------------------
      # Lambda -- function, version, alias, AWS_IAM Function URL, finite
      # reserved concurrency, CloudWatch log group with bounded retention.
      # -----------------------------------------------------------------
      - name: Create/update Lambda function
        id: lambda_fn
        shell: bash
        run: |
          set -euo pipefail
          lambda_role_arn="arn:aws:iam::${EXPECTED_ACCOUNT_ID}:role/${LAMBDA_EXECUTION_ROLE_NAME}"

          if aws logs describe-log-groups \
               --log-group-name-prefix "/aws/lambda/${LAMBDA_FUNCTION_NAME}" \
               --output json | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('logGroups') else 1)"; then
            echo "GC38R_LOG_GROUP_EXISTS"
          else
            aws logs create-log-group --log-group-name "/aws/lambda/${LAMBDA_FUNCTION_NAME}"
            aws logs put-retention-policy --log-group-name "/aws/lambda/${LAMBDA_FUNCTION_NAME}" --retention-in-days 14
            echo "GC38R_LOG_GROUP_CREATED"
          fi

          if aws lambda get-function --function-name "${LAMBDA_FUNCTION_NAME}" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "${LAMBDA_FUNCTION_NAME}" \
              --zip-file fileb://lambda/parser/handler.zip \
              --publish \
              --output json > /tmp/update-result.json
            echo "GC38R_LAMBDA_CODE_UPDATED"
          else
            aws lambda create-function \
              --function-name "${LAMBDA_FUNCTION_NAME}" \
              --runtime nodejs24.x \
              --role "${lambda_role_arn}" \
              --handler handler.handler \
              --zip-file fileb://lambda/parser/handler.zip \
              --timeout 15 \
              --memory-size 2048 \
              --environment "Variables={PARSER_INGRESS_BUCKET=${BUCKET_NAME},AWS_NODEJS_CONNECTION_REUSE_ENABLED=1}" \
              --publish \
              --tags Project=SmartBusiness,Environment=nonprod,Workstream=SB-P-1.11,Component=lambda-parser,Owner=TeamLIPS,ManagedBy=GitHubActions \
              --output json > /tmp/create-result.json
            echo "GC38R_LAMBDA_CREATED"
          fi

          aws lambda put-function-concurrency \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --reserved-concurrent-executions 5

          function_arn="$(aws lambda get-function --function-name "${LAMBDA_FUNCTION_NAME}" \
            --output json | python3 -c 'import json,sys; print(json.load(sys.stdin)["Configuration"]["FunctionArn"])')"
          echo "function_arn=${function_arn}" >> "${GITHUB_OUTPUT}"

          if aws lambda get-function-url-config --function-name "${LAMBDA_FUNCTION_NAME}" >/dev/null 2>&1; then
            echo "GC38R_FUNCTION_URL_EXISTS"
          else
            aws lambda create-function-url-config \
              --function-name "${LAMBDA_FUNCTION_NAME}" \
              --auth-type AWS_IAM \
              --invoke-mode RESPONSE_STREAM
            echo "GC38R_FUNCTION_URL_CREATED"
          fi

          function_url="$(aws lambda get-function-url-config --function-name "${LAMBDA_FUNCTION_NAME}" \
            --output json | python3 -c 'import json,sys; print(json.load(sys.stdin)["FunctionUrl"])')"
          echo "function_url=${function_url}" >> "${GITHUB_OUTPUT}"

      - name: Emit non-secret deployment summary
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          echo "lambda_function_arn=${{ steps.lambda_fn.outputs.function_arn }}" >> "${GITHUB_OUTPUT}"
          echo "function_url=${{ steps.lambda_fn.outputs.function_url }}" >> "${GITHUB_OUTPUT}"
          echo "trust_anchor_arn=${{ steps.roles_anywhere.outputs.trust_anchor_arn }}" >> "${GITHUB_OUTPUT}"
          echo "profile_arn=${{ steps.roles_anywhere.outputs.profile_arn }}" >> "${GITHUB_OUTPUT}"
          echo "workload_role_arn=arn:aws:iam::${EXPECTED_ACCOUNT_ID}:role/${WORKLOAD_ROLE_NAME}" >> "${GITHUB_OUTPUT}"
          {
            echo "## GC-38R Non-Production Parser Deployment"
            echo ""
            echo "| Resource | Value |"
            echo "|---|---|"
            echo "| Account | ${EXPECTED_ACCOUNT_ID} |"
            echo "| Region | ${AWS_REGION} |"
            echo "| Lambda function ARN | ${{ steps.lambda_fn.outputs.function_arn }} |"
            echo "| Function URL | ${{ steps.lambda_fn.outputs.function_url }} |"
            echo "| S3 bucket | ${BUCKET_NAME} |"
            echo "| Trust anchor ARN | ${{ steps.roles_anywhere.outputs.trust_anchor_arn }} |"
            echo "| Profile ARN | ${{ steps.roles_anywhere.outputs.profile_arn }} |"
            echo "| Workload role ARN | arn:aws:iam::${EXPECTED_ACCOUNT_ID}:role/${WORKLOAD_ROLE_NAME} |"
            echo "| New workload certificate generated this run | ${{ steps.roles_anywhere.outputs.cert_generated }} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload workload certificate material for out-of-band handoff
        if: steps.roles_anywhere.outputs.cert_generated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gc38r-workload-pki-handoff
          path: .parser-pki-handoff/
          retention-days: 1

      - name: New workload certificate material handoff notice
        if: steps.roles_anywhere.outputs.cert_generated == 'true'
        shell: bash
        run: |
          if [ -f "${GITHUB_WORKSPACE}/.parser-pki-handoff/trust-anchor-ca-private-key.pem" ]; then
            echo "::warning::A new Trust Anchor CA and workload end-entity certificate/private key were generated this run and uploaded as the short-lived (1-day retention) build artifact 'gc38r-workload-pki-handoff', never printed to this log. Only repository collaborators with Actions read access can download it. Mission Control must retrieve it from this run's Artifacts and: (1) provision workload-private-key.pem/workload-certificate.pem into the approved server secret store (Cloudflare Worker secret bindings) out of band; (2) store trust-anchor-ca-private-key.pem durably as the PARSER_TRUST_ANCHOR_CA_PRIVATE_KEY GitHub Actions environment secret on aws-nonprod-parser, so a future run can reissue the end-entity certificate without creating a second Trust Anchor; (3) delete the artifact and any local copies once both are done. Do not paste this material into any log, PR, issue, commit, or chat."
          else
            echo "::warning::The workload end-entity certificate was reissued this run under the existing Trust Anchor's CA and uploaded as the short-lived (1-day retention) build artifact 'gc38r-workload-pki-handoff', never printed to this log. Mission Control must retrieve workload-private-key.pem/workload-certificate.pem and provision them into the approved server secret store (Cloudflare Worker secret bindings) out of band, then delete the artifact/local copies. The Trust Anchor/Profile were not modified. Do not paste this material into any log, PR, issue, commit, or chat."
          fi

      - name: Remove local PKI handoff copy from the runner workspace
        if: always()
        shell: bash
        run: rm -rf "${GITHUB_WORKSPACE}/.parser-pki-handoff" /tmp/parser-pki
