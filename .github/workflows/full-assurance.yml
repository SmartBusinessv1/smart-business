name: Team LIPS Full Assurance

# SB-OPS-CI-ARCHITECTURE-1.0 Stage 2 -- Full Assurance.
#
# The selective, environment-dependent tier of the two-tier CI
# architecture: real Supabase integration tests, real-HTTP/security-
# boundary tests, and RLS/concurrency/database-behavior regression tests
# -- the 20 Supabase-dependent files from vitest.full.config.ts, run via
# `npm run test:full` against the approved, isolated `smart-business-test`
# GitHub Actions environment (the same environment/secret-name bindings
# already approved and provisioned under SB-OPS-CI-STABILIZATION-1.0;
# no new secret value is introduced by this workflow).
#
# Path-filtered rather than always-on: it triggers only for changes to
# paths that can materially affect integration/runtime behavior (see the
# `paths:` list below), so documentation/communication-only changes do
# not pay for a ~3.5 minute real-backend run. This workflow is
# deliberately NOT configured as a required branch-protection check
# while it uses native path-filter-skip triggering -- a required check
# that never starts for a non-matching PR would otherwise leave that PR
# permanently blocked. See
# docs/engineering/assurance/Build_Assurance_Baseline.md for the full
# two-tier contract and Mission Control's Stage 1 review/Stage 2
# authorization (communication/missions/SB-OPS-CI-ARCHITECTURE-1.0/
# mission-control/03-stage1-review-and-stage2-authorization.md, Decision
# 3 and Decision 7) for the approved path list and required-check
# boundary.
#
# This workflow does not modify application code, dependencies,
# database, runtime, or provider state.

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "supabase/**"
      - "lambda/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "vitest.fast.config.ts"
      - "vitest.full.config.ts"
      - "vitest.shared.ts"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "eslint.config.*"
      - ".github/workflows/build-assurance.yml"
      - ".github/workflows/full-assurance.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "supabase/**"
      - "lambda/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "vitest.fast.config.ts"
      - "vitest.full.config.ts"
      - "vitest.shared.ts"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "eslint.config.*"
      - ".github/workflows/build-assurance.yml"
      - ".github/workflows/full-assurance.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-full:
    name: Full Assurance Tests (vitest)
    runs-on: ubuntu-latest
    environment: smart-business-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Assurance Tests
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
        run: npm run test:full
