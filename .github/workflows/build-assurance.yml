name: Team LIPS Application Build Assurance

# SB-OPS-BUILD-ASSURANCE-1.0 -- Build Assurance & Automation Foundation
#
# Minimal application-build assurance baseline. Each job runs one real,
# repository-supported command and fails closed on its own result. No job
# suppresses, retries past, or auto-fixes a failure. See
# docs/engineering/assurance/Build_Assurance_Baseline.md for exactly what
# each job proves and does not prove.
#
# This workflow does not modify application code, dependencies, database,
# runtime, or provider state, and is not itself a required branch-protection
# check unless Mission Control/Founder separately configures it as one.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npx tsc --noEmit

  build:
    name: Build (vite build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

  test:
    name: Automated Tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test
